<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404-probe · 24 小时历史</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div><a class="back" href="/">← 返回</a><h1 id="title">Agent 历史</h1><p>最近 24 小时 · 1 分钟聚合</p></div><button id="logout" class="logout" type="button" disabled>退出</button></header>
  <main class="history-grid">
    <article class="google-status-detail" aria-labelledby="google-status-title">
      <h2 id="google-status-title">Google Status</h2>
      <p id="google-status-state">正在加载</p>
      <dl id="google-status-values"></dl>
      <p id="google-status-checked"></p>
    </article>
    <article class="outbounds" aria-labelledby="outbounds-title">
      <h2 id="outbounds-title">sing-box 出站选择器 <span>受控切换</span></h2>
      <p id="outbounds-status" class="outbounds-status">正在加载出站状态</p>
      <div id="outbounds-list" class="outbounds-list"></div>
    </article>
    <article class="chart"><h2>CPU %</h2><canvas id="cpu"></canvas></article>
    <article class="chart"><h2>RAM %</h2><canvas id="ram"></canvas></article>
    <article class="chart"><h2>RX / s</h2><canvas id="rx"></canvas></article>
    <article class="chart"><h2>TX / s</h2><canvas id="tx"></canvas></article>
    <div id="history-empty" class="empty">正在加载历史数据</div>
  </main>
  <script src="/history.js" defer></script>
  <script src="/session.js" defer></script>
</body>
</html>
